services:
  db:
    image: postgres:16.4-alpine
    container_name: finguard-db
    environment:
      POSTGRES_USER: finguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finguard_dev_password}
      POSTGRES_DB: finguard
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finguard"]
      interval: 5s
      retries: 10

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.6
    container_name: finguard-redpanda
    command:
      - redpanda
      - start
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://127.0.0.1:19092
      - --rpc-addr
      - redpanda:33145
      - --advertise-rpc-addr
      - redpanda:33145
      - --mode
      - dev-container
      - --smp
      - "1"
    ports:
      - "127.0.0.1:19092:19092"
    volumes:
      - redpanda_data:/var/lib/redpanda/data

  redis:
    image: redis:7.4.1-alpine
    container_name: finguard-redis
    environment:
      REDISCLI_AUTH: "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"
    command:
      - redis-server
      - --requirepass
      - "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: finguard-backend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://finguard:${POSTGRES_PASSWORD:-finguard_dev_password}@db:5432/finguard
      FINGUARD_JWT_SECRET: ${FINGUARD_JWT_SECRET:?FINGUARD_JWT_SECRET is required}
      FINGUARD_REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      FINGUARD_CORS_ORIGINS: ${FINGUARD_CORS_ORIGINS:-http://localhost:8080,http://localhost:5173}
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips=*"
    ports:
      - "8001:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  outbox-publisher:
    build:
      context: ./backend
    container_name: finguard-outbox-publisher
    depends_on:
      db:
        condition: service_healthy
      redpanda:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+psycopg://finguard:${POSTGRES_PASSWORD:-finguard_dev_password}@db:5432/finguard
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      FINGUARD_OUTBOX_MAX_ATTEMPTS: "5"
      FINGUARD_OUTBOX_POLL_SECONDS: "2.0"
    command: ["python", "-m", "app.workers.outbox_publisher"]
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: finguard-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: finguard-prometheus
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    image: grafana/grafana:11.2.2
    container_name: finguard-grafana
    depends_on:
      prometheus:
        condition: service_started
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?GRAFANA_ADMIN_USER is required}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"

volumes:
  pgdata:
  redpanda_data:
  grafana_data:
