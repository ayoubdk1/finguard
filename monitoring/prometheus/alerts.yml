groups:
  - name: finguard_alerts
    rules:
      - alert: High5xxRate
        expr: sum(rate(finguard_http_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(finguard_http_requests_total[5m])), 1) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "High 5xx error rate on FinGuard API"

      - alert: HighP95Latency
        expr: histogram_quantile(0.95, sum(rate(finguard_http_request_duration_seconds_bucket[5m])) by (le)) > 1.0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "HTTP p95 latency above 1s"

      - alert: OutboxDeadEvents
        expr: finguard_outbox_dead_count > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Outbox has DEAD events requiring investigation"

      - alert: LedgerReconciliationImbalance
        expr: finguard_ledger_reconciliation_imbalance != 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "FinGuard ledger reconciliation imbalance detected"

      - alert: RateLimitSpike
        expr: sum(rate(finguard_rate_limit_hits_total[5m])) > 1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Spike in rate-limit 429 rejections"
