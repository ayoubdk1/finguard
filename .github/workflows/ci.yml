name: FinGuard CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: finguard
          POSTGRES_PASSWORD: finguard_dev_password
          POSTGRES_DB: finguard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql+psycopg://finguard:finguard_dev_password@localhost:5432/finguard_test
      FINGUARD_JWT_SECRET: ci-test-secret-key-at-least-32-characters-long
      PYTHONPATH: .

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-auth.txt ]; then pip install -r requirements-auth.txt; fi

      - name: Run Alembic migrations on test DB
        run: alembic upgrade head

      - name: Run pytest suite
        run: pytest -v

  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies and run Vitest
        run: |
          npm ci
          npm test -- --run
