name: FinGuard CI

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: finguard
          POSTGRES_PASSWORD: finguard_dev_password
          POSTGRES_DB: finguard_test
        ports: [5432:5432]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://finguard:finguard_dev_password@localhost:5432/finguard_test
      FINGUARD_JWT_SECRET: ci-test-secret-key-at-least-32-characters-long
      FINGUARD_REDIS_URL: redis://localhost:6379/0
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-auth.txt -r requirements-dev.txt
      - name: Ruff & Mypy
        run: |
          ruff check app
          mypy app --config-file pyproject.toml
      - name: Alembic round-trip
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - name: Pytest with coverage
        run: pytest -v --cov=app --cov-report=term-missing --cov-report=xml:coverage.xml
      - name: Coverage badge
        run: |
          COV=$(python -c "import xml.etree.ElementTree as ET; print(round(float(ET.parse('coverage.xml').getroot().attrib['line-rate'])*100, 1))")
          echo "### Backend Coverage: **${COV}%**" >> "$GITHUB_STEP_SUMMARY"
          echo "[https://img.shields.io/badge/coverage-${COV}%25-brightgreen]" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
      - name: Ledger reconciliation
        run: python scripts/reconcile_ledger.py
      - name: pip-audit
        continue-on-error: true
        run: pip-audit -r requirements.txt -r requirements-auth.txt

  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc -b --noEmit
      - run: npm run lint
      - run: npm test
      - name: npm audit
        continue-on-error: true
        run: npm audit --audit-level=high

  security-and-container-scan:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          docker build -t finguard-backend:ci ./backend
          docker build -t finguard-frontend:ci ./frontend
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: finguard-backend:ci
          format: table
          exit-code: "0"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: finguard-frontend:ci
          format: table
          exit-code: "0"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
